name: internet_connection_monitor
description: Una librería para apps Dart y Flutter que comprueba si hay Internet y avisa cuando la conexión se pierde o vuelve, con revisiones periódicas y reintentos.
version: 0.1.2
homepage: https://victorf.dev/projects/internet-connection-monitor
repository: https://github.com/victorcode1/internet-connection-monitor
issue_tracker: https://github.com/victorcode1/internet-connection-monitor/issues
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  http: ^1.6.0
dev_dependencies:
  fake_async: ^1.3.3
  lints: ^5.1.1
  test: ^1.25.8
topics:
  - connectivity
  - internet
  - network
